{title:'늦은 자각',text:'침대에 누워 예전 카톡을 읽었다\n\n나중에 공연하면 보러 갈게\n\n그 말 하나에 지훈이가 얼마나 좋아했는지 기억났다\n\n지훈이가 웃는 게 좋았다\n형이라고 부르는 것도 좋았다\n\n그런데 그게 전부 재미있어서였을까\n\n도훈  아\n\n나 얘 좋아하네\n\n김도훈 진짜 늦게도 알아챘다',opts:[['내 마음을 제대로 전하기로 한다',3],['아직 확신이 없다고 생각한다',-2]]},
{title:'김도훈 형',text:'지훈이에게 먼저 연락했다\n\n도훈  지훈아 내일 뭐해\n지훈  학원 가요 ㅋㅋ\n도훈  그럼 끝나고 볼래?\n지훈  왜요?\n도훈  그냥 보고 싶어서\n지훈  ㅋㅋㅋㅋ 김도훈 형 또 놀리네\n\n김도훈 형\n\n도훈  성 붙이고 부르지 마\n\n그 애가 멀어진 게 이제야 실감 났다',opts:[['장난 아니라고 분명하게 말한다',2],['다시 장난처럼 얼버무린다',-2]]},
{title:'형 저한테 왜 그래요',text:'지훈이의 답장이 왔다\n\n형 저한테 왜 그래요?\n제가 형 좋아하는 줄 알고 그러는 거면\n이제 안 그러셔도 돼요\n\n그제야 깨달았다\n\n지훈이는 정말로 나를 좋아했구나\n그리고 내가 상처를 줬구나\n\n내일 학원 끝나고 기다릴게\n장난 아니야 나 너한테 할 말 있어\n\n한참 뒤 지훈이가 답했다\n\n알겠어요',opts:[['내일 직접 만나 솔직하게 고백한다',3,'confess'],['서로 상처받지 않도록 친구로 남는다',0,'friend'],['두려워서 약속을 피한다',-5,'leave']]}

function save(){localStorage.setItem('stage',stage);localStorage.setItem('score',score);localStorage.setItem('flags',JSON.stringify(flags))}
function story(){if(stage>=scenes.length){ending();return}let s=scenes[stage];show(header('다시 너에게')+`<div class="storybox"><div class="chapter">CHAPTER ${String(stage+1).padStart(2,'0')} / 09</div><h2>${s.title}</h2><div class="storytext">${s.text.replaceAll('\n','<br>')}</div>${s.opts.map((o,i)=>`<button class="choice" onclick="choose(${i})">${o[0]}　›</button>`).join('')}<p class="mini">선택은 자동 저장돼</p></div>`)}
function choose(i){let o=scenes[stage].opts[i];score+=o[1];if(o[2])flags.last=o[2];stage++;save();story()}
function ending(){let type=flags.last==='friend'?'friend':flags.last==='leave'?'bad':score>=7?'happy':'bad';let data={happy:['HAPPY ENDING','다시 도훈이 형','학원 앞에서 지훈이가 걸어 나왔다\n\n도훈  한지훈\n지훈  형 진짜 기다렸어요?\n도훈  응 그리고 미안해\n도훈  내가 너무 늦게 알았어\n\n지훈이는 말없이 나를 바라봤다\n\n도훈  나 너 좋아해\n도훈  귀여운 동생 말고 그냥 한지훈이 좋아\n\n지훈  진짜요?\n도훈  응 이번엔 장난 아니야\n\n한참 뒤 지훈이가 웃었다\n\n지훈  아 진짜 형 너무 늦었잖아요\n\n그날부터 도훈이 형이라는 말이 다시 따뜻하게 들렸다'],bad:['BAD ENDING','늦어 버린 말','지훈이는 약속 장소에서 한참을 기다렸다\n\n나는 끝내 가지 못했다\n\n며칠 뒤 복도에서 마주쳤을 때\n지훈이는 여전히 예의 바르게 인사했다\n\n지훈  안녕하세요 형\n\n이제 그 애는 나를 보고도 더는 멈추지 않았다\n\n그때 말했어야 했다\n\n좋아한다고'],friend:['FRIEND ENDING','우리 그냥 친한 사이','학원 앞에서 지훈이를 만났다\n\n도훈  내가 헷갈리게 해서 미안해\n지훈  괜찮아요 형\n\n우리는 한참을 걷다가 서로 웃었다\n\n지훈  형 다음 축제 때 노래 잘하세요\n도훈  너도 춤 잘 추고\n\n조금은 어색했지만\n서로에게 무리한 약속을 하지 않았다\n\n우리는 좋은 선후배로 남았다']}[type];show(header('마지막 페이지')+`<div class="storybox"><div class="chapter">${data[0]}</div><div class="end" style="margin-top:30px">${data[1]}</div><div class="storytext">${data[2].replaceAll('\n','<br>')}</div><button class="btn reset" onclick="restart()">처음부터 다시 시작</button><p class="muted">다른 선택을 하면 또 다른 엔딩을 볼 수 있어</p></div>`)}
function restart(){stage=0;score=0;flags={};save();story()}home();
</script></body></html>
